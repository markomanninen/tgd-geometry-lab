name: tests
on:
  push:
    branches: [main]
    paths:
      - "algebra/**"
      - "core/**"
      - "embedding/**"
      - "forms/**"
      - "geometry/**"
      - "spaces/**"
      - "tgd/**"
      - "tests/**"
      - "tgd-lab.mac"
      - "scripts/run_tests.sh"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "algebra/**"
      - "core/**"
      - "embedding/**"
      - "forms/**"
      - "geometry/**"
      - "spaces/**"
      - "tgd/**"
      - "tests/**"
      - "tgd-lab.mac"
      - "scripts/run_tests.sh"
      - ".github/workflows/tests.yml"
jobs:
  maxima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Maxima
        run: sudo apt-get -qq update && sudo apt-get -qq install -y maxima
      - name: Fetch Prodanov clifford package
        run: git clone -q --depth 1 https://github.com/dprodanov/clifford.git ../clifford
      - name: Run test suite
        run: ./scripts/run_tests.sh ../clifford
